plugins {
    id 'com.android.application' version '9.3.1'
    id 'com.chaquo.python' version '17.1.0'
}

android {
    namespace 'me.rerere.workspace.pythonprobe'
    compileSdk 37
    defaultConfig {
        applicationId 'me.rerere.workspace.pythonprobe'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

chaquopy {
    defaultConfig {
        version = '3.13'
        buildPython('python')
        pip {
            options '--index-url', 'https://pypi.tuna.tsinghua.edu.cn/simple',
                    '--extra-index-url', 'https://chaquo.com/pypi-13.1',
                    '--retries', '0', '--timeout', '45', '--only-binary', ':all:', '--verbose'
            install 'numpy'
            install 'pandas'
            install 'matplotlib'
            install 'openpyxl'
        }
    }
}
